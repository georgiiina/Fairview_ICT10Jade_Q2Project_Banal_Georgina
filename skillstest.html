<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Q2 Skills Test</title>
    <style>
        body {
            background-image: url('https://i.pinimg.com/736x/91/e6/84/91e68496d4fd711b8bc1ea881896a71e.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }

                .navbar {
            background-color: #f5ebe0;
            border-bottom: 2px solid #e3d5ca;
        }
        .navbar-brand, .nav-link {
            color: #4a3728 !important;
            font-weight: 600;
            border-radius: 8px;
            padding: 4px 10px !important;
            margin: 0 3px;
        }
        .nav-link:hover, .nav-link.active {
            background-color: #edede9;
        }
        .showcase-card {
            background-color: rgba(255, 250, 245, 0.94);
            border: 2px solid #d5bdaf;
            border-radius: 18px;
        }
        .btn-beige {
            background-color: #b08968;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-beige:hover {
            background-color: #8c674a;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand" href="index.html">Q2 Showcase</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="seatwork1.html">Seatwork 1</a>
                <a class="nav-link active" href="skillstest.html">Skills Test</a>
                <a class="nav-link" href="drill2.html">Drill 2</a>
                <a class="nav-link" href="creator.html">Meet the Creator</a>
            </div>
        </div>
    </nav>
    <div class="p-4 d-flex align-items-center justify-content-center">
        <div class="container d-flex justify-content-center">
            <div class="card shadow-lg p-4 w-100 border-0 rounded-4 bg-white bg-opacity-95" style="max-width: 500px;">

                <!-- Header -->
                <div class="text-white text-center p-3 rounded-3 mb-3" style="background-color: #c7c5fc;">
                <h2 class="m-0 fw-bold">Non-Metal Elements</h2>
                <p class="m-0 small opacity-75">Periodic Table Information Finder</p>
            </div>
            

            <!-- Input field -->
            <div class="mb-3">
                <label for="element_input" class="form-label fw-bold text-secondary">🔎 Element Symbol</label>
                <input type="text" id="element_input" class="form-control rounded-3" placeholder="e.g. H, C, O">
            </div>

            <!-- Button linked to periodic function -->
            <button id="search_btn" class="btn text-white w-100 py-2 fw-bold mb-3 rounded-3" style="background-color: #c7c5fc;" py-click="periodic">Check Details</button>

            <!-- Div for output result -->
            <div class="bg-light p-3 border-start rounded-3">
                <h6 class="text-dark fw-bold mb-2">Results Here:</h6>
                <div id="div_name" class="small text-muted">Enter a symbol above to find the non-metal!</div>
            </div>

        </div>
    </div>
</div>
    <script type="py" src="main.py"></script>

</body>
</html>
