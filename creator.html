    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card profile-card p-4 shadow-sm text-center">
                    <h2 class="fw-bold mb-1">🐻 Meet the Creator</h2>
                    <center><img src="georginaict.jpg" alt="Creator Image" class="img-fluid rounded-circle mb-3" style="width: 150px; height: 150px; object-fit: cover; border: 3px solid #d5bdaf;"></center>

                        <p class="mb-0"><strong> Favorite Quote:</strong> <em id="creator_quote"></em></p>
                    </div>

                    <p id="creator_count" class="text-muted small mb-0"></p>
                </div>
            </div>
        </div>
    </div>

    
    <script type="py">
        from pyscript import document

        # Dictionary containing creator profile details
        creator_profile = {
            "Name": "Georgina Florence B. Banal",
            "Section": "Grade 10 - Jade (OBMC Fairview)",
            "Hobbies": "Volleyball, Dance, Baking, Sleeping, Reading",
            "Dream": "Aviation / Aircraft Mechanic",
            "Favorite Quote": "She believed she could, so she did."
        }

        # Fill HTML elements from the dictionary
        document.querySelector("#creator_name").innerText = creator_profile["Name"]
        document.querySelector("#creator_section").innerText = creator_profile["Section"]
        document.querySelector("#creator_hobbies").innerText = creator_profile["Hobbies"]
        document.querySelector("#creator_dream").innerText = creator_profile["Dream"]
        document.querySelector("#creator_quote").innerText = f"\"{creator_profile['Favorite Quote']}\""

        # Show total number of profile entries using len()
        total_items = len(creator_profile)
    </script>
